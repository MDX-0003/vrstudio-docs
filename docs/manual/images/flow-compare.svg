<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#0f172a">三条流程的步骤与产物</text>
  <text x="40" y="72" font-size="14" fill="#64748b">横轴按操作顺序；红框标出需要特别注意的位置。</text>

  <!-- 局部重绘 -->
  <text x="40" y="150" font-size="16" font-weight="700" fill="#1d4ed8">局部重绘</text>
  <g font-size="15" fill="#0f172a" text-anchor="middle">
    <rect x="160" y="125" width="92" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="206" y="152">选区</text>
    <rect x="292" y="125" width="92" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="338" y="152">抽取</text>
    <rect x="424" y="125" width="92" height="44" rx="8" fill="#fef2f2" stroke="#e11d48" stroke-width="2"/>
    <text x="470" y="152">首尾帧</text>
    <rect x="556" y="125" width="92" height="44" rx="8" fill="#fef2f2" stroke="#e11d48" stroke-width="2"/>
    <text x="602" y="152">生成</text>
    <rect x="688" y="125" width="92" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="734" y="152">合并</text>
    <rect x="820" y="125" width="92" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="866" y="152">对比</text>
    <rect x="960" y="125" width="150" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1035" y="152">贴回原片的成片</text>
  </g>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <line x1="252" y1="147" x2="288" y2="147"/>
    <line x1="384" y1="147" x2="420" y2="147"/>
    <line x1="516" y1="147" x2="552" y2="147"/>
    <line x1="648" y1="147" x2="684" y2="147"/>
    <line x1="780" y1="147" x2="816" y2="147"/>
    <line x1="912" y1="147" x2="956" y2="147"/>
  </g>

  <!-- 全画幅重绘 -->
  <text x="40" y="275" font-size="16" font-weight="700" fill="#15803d">全画幅重绘</text>
  <g font-size="15" fill="#0f172a" text-anchor="middle">
    <rect x="160" y="250" width="112" height="44" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="216" y="277">扩充画面</text>
    <rect x="308" y="250" width="92" height="44" rx="8" fill="#fef2f2" stroke="#e11d48" stroke-width="2"/>
    <text x="354" y="277">生成</text>
    <rect x="436" y="250" width="112" height="44" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="492" y="277">裁回原尺寸</text>
    <rect x="584" y="250" width="92" height="44" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="630" y="277">对比</text>
    <rect x="712" y="250" width="150" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="787" y="277">裁回原尺寸的整片</text>
  </g>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <line x1="272" y1="272" x2="304" y2="272"/>
    <line x1="400" y1="272" x2="432" y2="272"/>
    <line x1="548" y1="272" x2="580" y2="272"/>
    <line x1="676" y1="272" x2="708" y2="272"/>
  </g>

  <!-- 简单生成 -->
  <text x="40" y="400" font-size="16" font-weight="700" fill="#b45309">简单生成</text>
  <g font-size="15" fill="#0f172a" text-anchor="middle">
    <rect x="160" y="375" width="92" height="44" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="206" y="402">生成</text>
    <rect x="292" y="375" width="150" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="367" y="402">AI 直接生成的视频</text>
  </g>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <line x1="252" y1="397" x2="288" y2="397"/>
  </g>

  <!-- 编号 -->
  <g>
    <rect x="936" y="108" width="22" height="22" rx="4" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
    <text x="947" y="124" font-size="13" font-weight="700" fill="#e11d48" text-anchor="middle">1</text>

    <rect x="532" y="108" width="22" height="22" rx="4" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
    <text x="543" y="124" font-size="13" font-weight="700" fill="#e11d48" text-anchor="middle">2</text>

    <rect x="400" y="108" width="22" height="22" rx="4" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
    <text x="411" y="124" font-size="13" font-weight="700" fill="#e11d48" text-anchor="middle">3</text>
  </g>

  <g font-size="13" fill="#475569">
    <text x="40" y="480">1　每行末尾是这条流程交付的产物。</text>
    <text x="40" y="504">2　三条流程都在「生成」这一步做预演检查与正式提交。</text>
    <text x="40" y="528">3　只有局部重绘需要先准备首帧与尾帧两张定稿图。</text>
  </g>
</svg>
